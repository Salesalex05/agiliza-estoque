<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Agiliza</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

   .logo-box{
    padding:20px;
    margin-bottom:30px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.logo-box img{
    max-width:170px;
    height:auto;
    display:block;
}

.logo-box img{
    max-width:170px;
    height:auto;
}

.logo-box img{
    max-width: 180px;
    height: auto;
}




.logo{
    margin-bottom:30px;
}

.logo img{
    width:150px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0a2a66,#0f52ba,#1e90ff);
}
.login-container{
   background:rgba(255,255,255,0.15);
    backdrop-filter:blur(20px);
    padding:40px;
    width:350px;
    border-radius:20px;
    box-shadow:0 15px 35px rgba(0,0,0,0.3);
    text-align:center;
    color:#fff;
    border:1px solid rgba(255,255,255,0.2);
}


.login-container h2{
    margin-bottom:30px;
    font-weight:600;
}

.input-group{
    margin-bottom:20px;
    text-align:left;
}

.input-group input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    outline:none;
    font-size:14px;
}

.login-btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#00c6ff;
    color:#fff;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.login-btn:hover{
    background:#0072ff;
}

.error{
    margin-top:15px;
    color:#ff4d4d;
    font-size:14px;
    display:none;
}

.loader{
    margin-top:15px;
    display:none;
}

.loader div{
    width:10px;
    height:10px;
    background:white;
    border-radius:50%;
    display:inline-block;
    animation: bounce 1s infinite alternate;
}

.loader div:nth-child(2){
    animation-delay:0.2s;
}
.loader div:nth-child(3){
    animation-delay:0.4s;
}

@keyframes bounce{
    to{ transform:translateY(-10px); }
}


#loading-overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#0f2027;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.spinner{
    width:50px;
    height:50px;
    border:5px solid #ffffff30;
    border-top:5px solid #00c6ff;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    100%{ transform:rotate(360deg); }
}



</style>
</head>

<body>

  

<div class="login-container">
  <div class="logo-box">
    <img src="agiliza4.png" alt="Agiliza">
</div>
    <form onsubmit="return validarLogin()">

        <div class="input-group">
            <input type="email" id="email" placeholder="Email" required>
        </div>

        <div class="input-group">
            <input type="password" id="senha" placeholder="Senha" required>
        </div>

        <button type="submit" class="login-btn">Entrar</button>

        <div class="error" id="erro">Email ou senha incorretos</div>

        <div class="loader" id="loader">
            <div></div><div></div><div></div>
        </div>

    </form>
</div>

<script>
function validarLogin(){

    var email = document.getElementById("email").value;
    var senha = document.getElementById("senha").value;
    var erro = document.getElementById("erro");
    var loader = document.getElementById("loader");

    erro.style.display = "none";
    loader.style.display = "block";

    setTimeout(function(){

        if(email === "admin@agiliza.com" && senha === "08112025"){

            localStorage.setItem("usuarioLogado", "true");

            window.location.href = "inicio.html";

        } else {
            loader.style.display = "none";
            erro.style.display = "block";
        }

    },1500);

    return false;
}
</script>







<div id="loading-overlay">
    <div class="spinner"></div>
</div>

<script>
window.addEventListener("load", function(){
    document.getElementById("loading-overlay").style.display = "none";
});
</script>

</body>


</html>
