<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agiliza - Movimentações</title>

    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="sidebar">
    <h2>AGILIZA</h2>
    <a href="dashboard.html">Dashboard</a>
    <a href="produtos.html">Produtos</a>
    <a href="movimentacoes.html">Movimentações</a>
    <a href="relatorios.html">Relatórios</a>
</div>

<div class="main">
    <h1>Entrada e Saída</h1>

    <form id="movForm">
        <input type="text" placeholder="Produto">
        <select>
            <option>Entrada</option>
            <option>Saída</option>
        </select>
        <input type="number" placeholder="Quantidade">
        <button type="submit">Registrar</button>
    </form>

<form id="movForm">
    <input type="text" id="movNome" placeholder="Nome do Produto" required>

    <select id="movTipo">
        <option>Entrada</option>
        <option>Saída</option>
    </select>

    <input type="number" id="movQtd" placeholder="Quantidade" required>

    <button type="submit">Registrar</button>
</form>

</div>

<script src="js/app.js"></script>

</body>
</html>
