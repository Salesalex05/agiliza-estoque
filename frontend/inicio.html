   <script>
document.addEventListener("DOMContentLoaded", function(){

    const contadores = document.querySelectorAll(".contador");

    contadores.forEach(contador => {

        const valorFinal = +contador.dataset.valor;
        let atual = 0;
        const incremento = valorFinal / 80;

        function animar(){

            atual += incremento;

            if(atual < valorFinal){
                contador.textContent = Math.floor(atual).toLocaleString();
                requestAnimationFrame(animar);
            } else {
                contador.textContent = valorFinal.toLocaleString() + "+";
            }
        }

        animar();
    });

});
</script>

   <script>
document.addEventListener("DOMContentLoaded", function(){

    let slideAtual = 0;
    const slides = document.querySelectorAll(".slide");
    const btnEsquerda = document.querySelector(".esquerda");
    const btnDireita = document.querySelector(".direita");

    function mostrarSlide(index){
        slides.forEach(slide => slide.classList.remove("ativo"));
        slides[index].classList.add("ativo");
    }

    btnDireita.addEventListener("click", function(){
        slideAtual++;
        if(slideAtual >= slides.length){
            slideAtual = 0;
        }
        mostrarSlide(slideAtual);
    });

    btnEsquerda.addEventListener("click", function(){
        slideAtual--;
        if(slideAtual < 0){
            slideAtual = slides.length - 1;
        }
        mostrarSlide(slideAtual);
    });

});
</script> 

   <script>
document.addEventListener("DOMContentLoaded", function(){

    let slideAtual = 0;
    const slides = document.querySelectorAll(".slide");
    const dots = document.querySelectorAll(".dot");
    const btnEsquerda = document.querySelector(".esquerda");
    const btnDireita = document.querySelector(".direita");

    function atualizarSlider(novoIndex){
        slides.forEach(slide => slide.classList.remove("ativo"));
        dots.forEach(dot => dot.classList.remove("ativo"));

        slides[novoIndex].classList.add("ativo");
        dots[novoIndex].classList.add("ativo");

        slideAtual = novoIndex;
        animarContador(slides[novoIndex]);
    }

    btnDireita.addEventListener("click", function(){
        let novo = (slideAtual + 1) % slides.length;
        atualizarSlider(novo);
    });

    btnEsquerda.addEventListener("click", function(){
        let novo = (slideAtual - 1 + slides.length) % slides.length;
        atualizarSlider(novo);
    });

    function animarContador(slide){
        const contador = slide.querySelector(".contador");
        if(!contador) return;

        const valorFinal = +contador.dataset.valor;
        let atual = 0;
        const incremento = valorFinal / 50;

        const intervalo = setInterval(() => {
            atual += incremento;
            if(atual >= valorFinal){
                contador.textContent = valorFinal.toLocaleString() + "+";
                clearInterval(intervalo);
            } else {
                contador.textContent = Math.floor(atual).toLocaleString();
            }
        }, 20);
    }

    atualizarSlider(0);

    setInterval(() => {
        let novo = (slideAtual + 1) % slides.length;
        atualizarSlider(novo);
    }, 6000);

});
</script>
    
<script>
document.addEventListener("DOMContentLoaded", function () {

    const canvas = document.getElementById("grafico");
    const ctx = canvas.getContext("2d");

    const dados = [30, 45, 40, 60, 80, 75, 95];
    let progresso = 0;

    function desenharLinha(progress) {

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // GRID estilo BI
        ctx.strokeStyle = "rgba(255,255,255,0.05)";
        ctx.lineWidth = 1;

        for (let i = 0; i < 5; i++) {
            let y = (canvas.height / 5) * i;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(canvas.width, y);
            ctx.stroke();
        }

        // Área preenchida animada
        ctx.beginPath();
        dados.forEach((valor, i) => {

            const x = (i / (dados.length - 1)) * canvas.width;
            const y = canvas.height - (valor * 2 * progress);

            if (i === 0) {
                ctx.moveTo(x, y);
            } else {
                ctx.lineTo(x, y);
            }
        });

        ctx.lineTo(canvas.width, canvas.height);
        ctx.lineTo(0, canvas.height);
        ctx.closePath();

        let gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, "rgba(0,198,255,0.4)");
        gradient.addColorStop(1, "rgba(0,198,255,0.05)");

        ctx.fillStyle = gradient;
        ctx.fill();

        // Linha principal com glow
        ctx.strokeStyle = "#00c6ff";
        ctx.lineWidth = 3;
        ctx.shadowBlur = 20;
        ctx.shadowColor = "#00c6ff";

        ctx.beginPath();
        dados.forEach((valor, i) => {

            const x = (i / (dados.length - 1)) * canvas.width;
            const y = canvas.height - (valor * 2 * progress);

            if (i === 0) {
                ctx.moveTo(x, y);
            } else {
                ctx.lineTo(x, y);
            }
        });

        ctx.stroke();

        // Pontos pulsando
        dados.forEach((valor, i) => {

            const x = (i / (dados.length - 1)) * canvas.width;
            const y = canvas.height - (valor * 2 * progress);

            ctx.beginPath();
            ctx.arc(x, y, 6 + Math.sin(Date.now() / 300) * 2, 0, Math.PI * 2);
            ctx.fillStyle = "#00c6ff";
            ctx.fill();
        
        const canvas = document.getElementById("grafico");
const ctx = canvas.getContext("2d");

/* Ajuste automático */
canvas.width = canvas.offsetWidth;
canvas.height = canvas.offsetHeight;
        });
    }

    function animar() {
        progresso += 0.02;
        if (progresso > 1) progresso = 1;

        desenharLinha(progresso);

        if (progresso < 1) {
            requestAnimationFrame(animar);
        }
    }

    animar();
});
</script>
